<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <g id="approval">
    <g id="submit" data-kind="box">
      <rect id="submit-rect" x="60" y="100" width="180" height="60" fill="#4a90d9"/>
      <text id="submit-label" x="80" y="135">提交申请</text>
    </g>
    <g id="review" data-kind="box">
      <rect id="review-rect" x="350" y="100" width="180" height="60" fill="#f5a623"/>
      <text id="review-label" x="370" y="135">人工审批</text>
    </g>
    <g id="archive" data-kind="box">
      <rect id="archive-rect" x="640" y="100" width="180" height="60" fill="#4a90d9"/>
      <text id="archive-label" x="660" y="135">归档</text>
    </g>
    <line id="submit-review" x1="240" y1="130" x2="350" y2="130" stroke="#334155"/>
    <line id="review-archive" x1="530" y1="130" x2="640" y2="130" stroke="#334155"/>
  </g>
</svg>
